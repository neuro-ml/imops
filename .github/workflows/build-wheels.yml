name: build-wheels

on:
  workflow_call:
    inputs:
      cibw_build:
        required: true
        type: string
      cibw_skip:
        required: false
        type: string
        default: ""
      mock:
        required: false
        type: boolean
        default: false
      upload_artifacts:
        required: false
        type: boolean
        default: false

env:
  MODULE_NAME: imops

jobs:
  build_wheels:
    strategy:
      matrix:
        os: [ ubuntu-22.04, windows-2022, macOS-13 ]
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Mock wheels
        if: ${{ inputs.mock }}
        run: |
          New-Item -ItemType Directory -Force -Path wheelhouse | Out-Null
          "Create mock wheels" | Out-File -Encoding ascii "wheelhouse/mock_wheels_${{ matrix.os }}.whl"
        shell: pwsh

      - name: Set up Python 3.9
        if: ${{ inputs.mock == false }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install cibuildwheel
        if: ${{ inputs.mock == false }}
        run: python -m pip install cibuildwheel==2.17.0

      - name: Install llvm for mac
        if: ${{ matrix.os == 'macOS-13' && inputs.mock == false }}
        run: |
          brew install llvm

      - name: Install g++-11 for ubuntu
        if: ${{ matrix.os == 'ubuntu-22.04' && inputs.mock == false }}
        id: install_cc
        uses: rlalik/setup-cpp-compiler@master
        with:
          compiler: g++-11

      - name: Check compilers for ubuntu
        if: ${{ matrix.os == 'ubuntu-22.04' && inputs.mock == false }}
        run: |
          ls /usr/bin/gcc*
          ls /usr/bin/g++*
          sudo ln -sf /usr/bin/gcc-11 /usr/bin/gcc
          sudo ln -sf /usr/bin/g++-11 /usr/bin/g++
          g++ --version
          gcc --version

      - name: Build wheels
        if: ${{ inputs.mock == false }}
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ENVIRONMENT_MACOS: >
            CC="$(brew --prefix llvm)/bin/clang" CXX="$(brew --prefix llvm)/bin/clang++"
            LDFLAGS="-L/opt/homebrew/opt/llvm/lib/c++ -L/opt/homebrew/opt/llvm/lib/unwind -lunwind"
          CIBW_BUILD: ${{ inputs.cibw_build }}
          CIBW_SKIP: ${{ inputs.cibw_skip }}
          CIBW_BEFORE_BUILD_LINUX: >
            if [ $(python -c "import sys; print(sys.version_info[1])") -ge 9 ]; then
              python -m pip install "numpy<3.0.0" --config-settings=setup-args="-Dallow-noblas=true";
            fi

      - name: Upload wheels
        if: ${{ inputs.upload_artifacts }}
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl

      - name: Cleanup all local files
        if: ${{ inputs.mock }}
        run: Remove-Item -Recurse -Force wheelhouse
        shell: pwsh