name: build-wheels

on:
  workflow_call:
    inputs:
      cibw_build:
        required: true
        type: string
      cibw_skip:
        required: false
        type: string
        default: ""

env:
  MODULE_NAME: imops

jobs:
  build_wheels:
    strategy:
      matrix:
        os: [ ubuntu-22.04, windows-2022, macOS-15 ]
    name: Build wheels on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'

      - name: Install cibuildwheel
        run: python -m pip install cibuildwheel==2.17.0

      - name: Install llvm for mac
        if: ${{ matrix.os == 'macOS-15' }}
        run: |
          brew install llvm

      - name: Install g++-11 for ubuntu
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        id: install_cc
        uses: rlalik/setup-cpp-compiler@master
        with:
          compiler: g++-11

      - name: Check compilers for ubuntu
        if: ${{ matrix.os == 'ubuntu-22.04' }}
        run: |
          ls /usr/bin/gcc*
          ls /usr/bin/g++*
          sudo ln -sf /usr/bin/gcc-11 /usr/bin/gcc
          sudo ln -sf /usr/bin/g++-11 /usr/bin/g++
          g++ --version
          gcc --version

      - name: Build wheels
        run: |
          python -m pip install --upgrade pip
          python -m pip install build wheel
          python -m cibuildwheel --output-dir wheelhouse
        env:
          CIBW_ENVIRONMENT_MACOS: >
            CC="$(brew --prefix llvm)/bin/clang" CXX="$(brew --prefix llvm)/bin/clang++"
            LDFLAGS="-L$(brew --prefix llvm)/lib/c++ -L$(brew --prefix llvm)/lib/unwind -lunwind"
          CIBW_BUILD: ${{ inputs.cibw_build }}
          CIBW_SKIP: ${{ inputs.cibw_skip }}
          CIBW_BEFORE_BUILD_LINUX: >
            if [ $(python -c "import sys; print(sys.version_info[1])") -ge 9 ]; then
              python -m pip install "numpy<3.0.0" --config-settings=setup-args="-Dallow-noblas=true";
            fi

      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ matrix.os }}
          path: ./wheelhouse/*.whl